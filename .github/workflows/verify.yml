name: verify-kernel

# 守护两件事：
#   1. plain/_worker.js 与上游压缩内核 _worker.js 语义等价（AST alpha 等价）
#   2. 明文内核与 cfnew-panel 的接口契约一致（面板自带 55 项测试）
#
# 触发（不设定时任务，只在"有事发生"时跑）：
#   - push 到 core-only：仓库内容被修改（人推的、或本地推的）
#   - sync-upstream 跑完：同步工作流用 GITHUB_TOKEN 推送不会触发 push 事件，
#     所以这里用 workflow_run 补上，只在同步成功时验证它推上来的结果
#   - pull_request / 手动：保留给审阅和临时排查
#
# 每日定时巡检已移除：没有变更就不该有验证跑，避免空跑和噪音。

on:
  push:
    branches: [core-only]
  pull_request:
    branches: [core-only]
  workflow_run:
    workflows: ["sync-upstream"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: verify-kernel-${{ github.event_name }}-${{ github.event.workflow_run.id || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── 1. 明文内核 vs 压缩内核 ─────────────────────────────────────────────
  alpha-equivalence:
    name: 明文内核 alpha 等价
    # workflow_run 只验证"同步成功"的结果，同步失败了就别再重复报一遍红
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # workflow_run 默认检出默认分支（core-only）最新提交，即同步推上来的那次结果
          ref: ${{ github.event_name == 'workflow_run' && 'core-only' || github.ref }}

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tools/package.json

      - name: 安装还原工具依赖
        working-directory: tools
        run: npm ci --no-audit --no-fund

      - name: AST alpha 等价性校验
        run: node tools/verify-alpha.mjs _worker.js plain/_worker.js

      - name: 明文内核可由脚本确定性重建（防止手改漂移）
        run: |
          node tools/deobfuscate.mjs
          git diff --exit-code -- plain/_worker.js
        shell: bash

      - name: 记录内核版本
        run: |
          version=$(node -e "console.log(require('fs').readFileSync('plain/_worker.js','utf8').match(/CORE_VERSION = \"([^\"]+)\"/)[1])")
          echo "内核版本：$version" | tee -a "$GITHUB_STEP_SUMMARY"

  # ── 2. 与面板的接口契约 ────────────────────────────────────────────────
  panel-compat:
    name: 面板接口契约（55 项）
    runs-on: ubuntu-latest
    needs: alpha-equivalence
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && 'core-only' || github.ref }}

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: 取面板（作者仓库最新 main）
        run: git clone --depth 1 https://github.com/byJoey/cfnew-panel.git panel

      - name: 面板 fixture 与本仓库内核是否同步（仅提示）
        run: |
          mine=$(sha256sum _worker.js | cut -d' ' -f1)
          fixture=$(sha256sum panel/test/core-fixture.mjs 2>/dev/null | cut -d' ' -f1 || echo "missing")
          echo "本仓库 _worker.js: $mine"
          echo "面板 core-fixture: $fixture"
          if [ "$mine" != "$fixture" ]; then
            echo "::notice::面板 fixture 与本仓库内核不一致（面板可能已发布新内核），本条不阻断构建。"
          fi

      - name: 面板测试套件（内核指向明文版）
        working-directory: panel
        env:
          CFNEW_TEST_CORE: ${{ github.workspace }}/plain/_worker.js
        run: node --test src/test/*.test.mjs
