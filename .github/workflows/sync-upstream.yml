name: kernel-pipeline

# 仓库里唯一的自动化流水线（原 verify-kernel、release-kernel 都已并入）：
#
#   仓库被修改（push / PR） → 只跑校验：产物可重现 + alpha 等价 + 面板 55 项 × 2（明文/混淆）
#   定时 / 手动            → 跑同步：merge 上游 → prettier（取上游压缩产物）→ align
#                            → 上游明文与本地明文三方合并 → 重新混淆（_worker.js + pages.zip）
#                            → 同样的校验 → 提交推送 → 发布 Release → 待命名则开 issue
#
# 注意：plain/_worker.js 是本仓库的源（可能含本地改动），校验不再从 _worker.pretty.js
# 反向重建它；只有同步上游时才以上游压缩产物为输入，并把解出的上游明文与本仓库明文三方合并。
#
# 发布不再单独开工作流：同步任务里自带 release.sh（tag = CORE_VERSION + 明文内核内容哈希，
# 内核内容不变就幂等跳过；版本号不变、内核代码变了也会发新 Release）。
# 没有"每天固定时间"的巡检：要么仓库有变更，要么到了每周同步时间，否则不跑。
#
# 编码方向（明文 → _worker.js + pages.zip）也有独立工作流 obfuscate.yml：
# 本文件负责"上游 → 明文"，它负责"明文 → 发布产物"，两边共用 tools/build-kernel.mjs。

on:
  push:
    branches: [core-only]
  pull_request:
    branches: [core-only]
  schedule:
    - cron: "23 4 * * 1" # 每周一 04:23 UTC（北京 12:23）
  workflow_dispatch:
    inputs:
      force:
        description: "即使与上游一致也完整跑一遍同步流水线（验证流程 / 检查格式漂移）"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: kernel-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

env:
  UPSTREAM_REPO: https://github.com/byJoey/cfnew.git
  UPSTREAM_BRANCH: core-only
  PANEL_REPO: https://github.com/byJoey/cfnew-panel.git
  PRETTIER: "3.9.10"
  CFNEW_TEST_CORE: ${{ github.workspace }}/plain/_worker.js

jobs:
  # ── 校验：仓库内容被修改时跑（push / PR） ───────────────────────────────
  verify:
    name: 校验（align 自测 + 混淆自测 + 产物可重现 + 面板 55 项 × 2）
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tools/package.json

      - name: 安装工具依赖
        working-directory: tools
        run: npm ci --no-audit --no-fund

      - name: 校验（align 自测 + 混淆自测 + 产物可重现 + 面板 55 项 × 2）
        run: bash tools/check.sh

      - name: 记录内核版本
        run: |
          version=$(node -e "console.log(require('fs').readFileSync('plain/_worker.js','utf8').match(/CORE_VERSION = \"([^\"]+)\"/)[1])")
          echo "内核版本：$version" | tee -a "$GITHUB_STEP_SUMMARY"

  # ── 同步：定时或手动触发（含解码对齐、校验、发布） ─────────────────────
  sync:
    name: 同步上游 + 解码对齐
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: core-only
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: 安装工具依赖
        working-directory: tools
        run: npm ci --no-audit --no-fund

      - name: 拉取上游并判断是否有更新
        id: check
        run: |
          git remote add upstream "$UPSTREAM_REPO" 2>/dev/null || git remote set-url upstream "$UPSTREAM_REPO"
          git fetch --no-tags upstream "$UPSTREAM_BRANCH"
          behind=$(git rev-list --count "HEAD..upstream/$UPSTREAM_BRANCH")
          sha=$(git rev-parse --short "upstream/$UPSTREAM_BRANCH")
          echo "behind=$behind" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          if [ "$behind" = "0" ] && [ "${{ inputs.force }}" != "true" ]; then
            echo "already=1" >> "$GITHUB_OUTPUT"
            echo "上游无更新（$sha），跳过同步" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "already=0" >> "$GITHUB_OUTPUT"
            echo "上游领先 $behind 个提交（$sha），开始同步" | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: 合并上游（压缩产物取上游，文档冲突自动解决）
        if: steps.check.outputs.already == '0' && steps.check.outputs.behind != '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 细节见 tools/merge-upstream.sh：
          #   _worker.js / pages.zip 先取上游（解码输入）并单独提交，合并时不再冲突；
          #   README.md / .gitignore 的冲突按本仓库自有内容自动解决；
          #   .github/ 保持本仓库版本（不并入上游 workflow，否则 GITHUB_TOKEN 推送会被拒）；
          #   其他文件冲突仍然失败退出，交人工处理。
          bash tools/merge-upstream.sh "upstream/$UPSTREAM_BRANCH"

      - name: 重新格式化上游内核（prettier，行号基准）
        if: steps.check.outputs.already == '0'
        run: |
          # 行号基准只取上游压缩产物：本仓库的 _worker.js 是由本地明文重新混淆的，
          # 短名与上游不同，直接格式化会破坏 names.json 的对应关系。
          git show "upstream/$UPSTREAM_BRANCH:_worker.js" > "$RUNNER_TEMP/upstream-worker.js"
          npx --yes "prettier@$PRETTIER" --parser babel --print-width 100 "$RUNNER_TEMP/upstream-worker.js" > _worker.pretty.new.js

      - name: 命名对齐（把旧映射平移到新版）
        if: steps.check.outputs.already == '0'
        run: |
          node tools/align.mjs --old _worker.pretty.js --new _worker.pretty.new.js --report align-report.md | tee align.log
          mv _worker.pretty.new.js _worker.pretty.js
          cat align-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: 上游明文与本地改动三方合并
        if: steps.check.outputs.already == '0'
        run: |
          work="$RUNNER_TEMP/plain-merge"
          mkdir -p "$work"
          # base：旧上游明文（用对齐前的 pretty + names 解出，即本地改动之前的版本）
          git show HEAD:_worker.pretty.js > "$work/pretty.old.js"
          git show HEAD:tools/names.json > "$work/names.old.json"
          git show HEAD:tools/comments.json > "$work/comments.old.json"
          CFNEW_PRETTY="$work/pretty.old.js" \
          CFNEW_NAMES="$work/names.old.json" \
          CFNEW_COMMENTS="$work/comments.old.json" \
          CFNEW_OUT="$work/base.js" node tools/deobfuscate.mjs
          # ours：本仓库当前明文（可能含本地改动）；theirs：上游新内核解出的明文
          cp plain/_worker.js "$work/ours.js"
          CFNEW_OUT="$work/theirs.js" node tools/deobfuscate.mjs
          if ! git merge-file -p "$work/ours.js" "$work/base.js" "$work/theirs.js" > "$work/merged.js"; then
            echo "::error::plain/_worker.js 的本地改动与上游内核冲突，请手动合并后重跑同步（未写入工作区）。"
            exit 1
          fi
          cp "$work/merged.js" plain/_worker.js
          echo "上游明文已按 base/ours/theirs 三方合并，本地改动保留" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: 重新混淆（明文 → _worker.js + pages.zip）
        if: steps.check.outputs.already == '0'
        run: node tools/build-kernel.mjs

      - name: 校验（align 自测 + 混淆自测 + 产物可重现 + 面板 55 项 × 2）
        if: steps.check.outputs.already == '0'
        run: bash tools/check.sh

      - name: 提交并推送
        if: steps.check.outputs.already == '0'
        id: push
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "pushed=0" >> "$GITHUB_OUTPUT"
            echo "工作区无变化，不产生提交" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          version=$(node -e "console.log(require('fs').readFileSync('plain/_worker.js','utf8').match(/CORE_VERSION = \"([^\"]+)\"/)[1])")
          git commit -m "chore: 同步上游内核 $version（${{ steps.check.outputs.sha }}）

          自动流程：merge 上游 → prettier（取上游压缩产物）→ align → 上游明文与本地明文三方合并 → 重新混淆（_worker.js + pages.zip）→ alpha 校验 → 面板 55 项测试（明文/混淆各一遍）"
          git push origin "HEAD:$UPSTREAM_BRANCH"
          echo "pushed=1" >> "$GITHUB_OUTPUT"
          {
            echo "已推送提交：$(git rev-parse --short HEAD)"
            echo "内核版本：$version"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 发布内核 Release（明文 + 混淆）
        # 不依赖这次是否真的推了提交：dispatch 手动改过内核后也走这里。
        # tag = CORE_VERSION + 明文内核内容哈希（plain/_worker.js 的 sha256 前 10 位）。
        # 内核内容不变（只换混淆种子 / 只改文档）就幂等跳过；
        # 版本号没变但内核代码变了，哈希不同 → 发新 Release，旧版本保留。
        if: steps.check.outputs.already == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(bash tools/release.sh --check | grep '^TAG=' | cut -d= -f2)
          bash tools/release.sh
          {
            echo ""
            echo "已发布内核 $tag（tag = CORE_VERSION + 明文内核内容哈希；内容相同则跳过）"
            echo "资产：_worker.js（压缩/混淆）、_worker.plain.js（明文）、pages.zip、SHA256SUMS.txt"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 有未命名函数时开 issue
        if: steps.check.outputs.already == '0' && steps.push.outputs.pushed == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pending=$(grep -oP 'PENDING_NAMES=\K\d+' align.log | tail -1 || echo 0)
          if [ "${pending:-0}" = "0" ]; then
            echo "全部函数都已命名，无需开 issue" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          version=$(node -e "console.log(require('fs').readFileSync('plain/_worker.js','utf8').match(/CORE_VERSION = \"([^\"]+)\"/)[1])")
          title="上游内核 $version 有 $pending 个函数待命名"
          existing=$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // empty')
          {
            echo "$title"
            echo ""
            echo "同步流程已自动完成并通过 alpha 校验与面板测试，以下函数还没起语义名（保留原始短名）："
            echo ""
            cat align-report.md
            echo ""
            echo "补名字方式：把上表行号加进 \`tools/names.json\`（值=语义名，可顺带加 \`tools/comments.json\` 注释），"
            echo "然后本地跑 \`node tools/deobfuscate.mjs\` 重新生成 \`plain/_worker.js\`。"
          } > /tmp/issue-body.md
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file /tmp/issue-body.md
          else
            gh issue create --title "$title" --body-file /tmp/issue-body.md
          fi
